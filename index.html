<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vbcd · 项目启动页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 60%, #ecfeff 100%);
      color: #1e293b;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #4f46e5;
      background: #eef2ff;
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.7; color: #64748b; }
    .steps {
      margin-top: 24px;
      text-align: left;
      font-size: 14px;
      color: #475569;
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .steps li { margin: 6px 0 6px 18px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">28 天 VibeCoding 打卡训练营</span>
    <h1>占位页已就位 ✅</h1>
    <p>
      这是第一次提交的占位页面，用来验证「本地文件 → GitHub 仓库」这条链路是通的。<br />
      真正的功能开发从 Day 7 的 MVP 开始。
    </p>
    <ul class="steps">
      <li>Day 2（今天）：仓库初始化 + 首次提交</li>
      <li>Day 3–6：写 research.md / PRD.md / TECH_DESIGN.md</li>
      <li>Day 7：用文档生成第一个能跑的 MVP</li>
    </ul>
  </main>
</body>
</html>
