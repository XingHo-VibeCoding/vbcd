# Nginx：托管前端静态产物 + 把 /api 反代到后端容器
# 关键两点（都是踩过才知道的坑）：
#   1. try_files 回退到 index.html —— 不做这条，/ask、/notes/xxx 直接刷新会 404（前端是 React Router 单页应用）
#   2. SSE 接口单独关缓冲 —— 不关的话 /api/kb/stream 的逐字输出会被攒着一起来，打字机效果失效
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端单页应用：找不到的路径一律交给 index.html 由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 流式问答（SSE）：必须关掉缓冲与缓存，并放宽读超时
    location = /api/kb/stream {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';   # SSE 需要长连接，不要复用
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 其余接口：普通反代（保留 /api 前缀，后端路由就是 /api/...）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
