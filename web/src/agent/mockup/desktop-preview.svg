  <text x="458" y="790" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="11" font-weight="400" fill="#a36708">♧ 请先确认或拒绝上面的草案，再继续对话。</text>
  <text x="458" y="826" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="15" font-weight="400" fill="#738096">处理归档草案后，继续聊…</text>
  <text x="458" y="873" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="10" font-weight="400" fill="#738096">♧ 写入资料前会征求你的确认</text>
  <rect x="1238" y="844" width="35" height="35" rx="12" fill="#615fff" fill-opacity=".45" />
