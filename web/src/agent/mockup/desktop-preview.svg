  <text x="514" y="444" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="11" font-weight="400" fill="#738096">确认后，将保存到你的学习资料。</text>
  <text x="1214" y="423" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="10" font-weight="400" fill="#a36708">待确认</text>
