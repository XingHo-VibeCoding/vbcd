      <stop stop-color="#fdf2f8" />
      <stop offset=".5" stop-color="#fff1f2" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="logo" x2="1" y2="1">
      <stop stop-color="#615fff" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.35">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#232340" flood-opacity=".10" />
    </filter>
  </defs>
