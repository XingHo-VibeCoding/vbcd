  <text x="879" y="264" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="15" font-weight="400" fill="#243047">把刚才讨论的整理方法归档到学习资料。</text>
  <rect x="452" y="307" width="29" height="29" rx="10" fill="#eef2ff" />
  <text x="459" y="327" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="17" font-weight="400" fill="#615fff">✧</text>
  <text x="497" y="326" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="14" font-weight="400" fill="#243047">我整理了一份归档草案，请先查看内容，再决定是否保存。</text>
  <text x="499" y="367" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="12" font-weight="400" fill="#738096">✓  已查询资料库    3 条相关资料    ›</text>
