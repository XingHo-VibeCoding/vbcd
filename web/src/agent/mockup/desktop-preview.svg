  <rect x="72" y="368" width="58" height="19" rx="6" fill="#fffaf0" />
  <text x="78" y="381" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="10" font-weight="400" fill="#a36708">待确认</text>
  <text x="52" y="430" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="11" font-weight="400" fill="#738096">昨天</text>
  <text x="55" y="467" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="12" font-weight="400" fill="#243047">▱  Agent 架构与工具设计</text>
  <text x="52" y="516" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="11" font-weight="400" fill="#738096">更早</text>
