# buddy 单机部署编排（Nginx + 后端 + Chroma + ASR 转写服务）
# 用法（本机彩排 / 服务器上线同一份）：
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f server
#
# 设计要点：
#   - Chroma 不发布端口，只在内部网络可达 —— 从根上避免向量库裸奔公网
#   - 前后端同源（Nginx 同时托管静态页与反代 /api），HttpOnly Cookie 零跨域配置
#   - data/ 用绑定挂载，宿主机上直接能看到 Markdown；chroma 数据用命名卷

services:
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    # 持久化路径不是猜的：镜像内 /config.yaml 写明 persist_path: "/data"（实测 chroma 1.4.4）
    # 官方镜像默认监听 8000（EXPOSE 8000/tcp）
    volumes:
      - chroma-data:/data
    networks: [internal]
    # 刻意不写 ports：不给公网留入口

  pg:
    # PostgreSQL（Day 16 建表、Day 17 接入）：notes/tasks 两张核心表
    # 设计要点同 chroma —— 不发布端口，只在 compose 内网被 server 访问
    image: postgres:18-alpine   # 本机已有此镜像；Docker Hub 不通时无需拉取
    restart: unless-stopped
    environment:
      POSTGRES_DB: buddy
      POSTGRES_USER: buddy
      # 口令从 server/.env 的 PG_PASSWORD 读（不入库、不截图）；不设置则启动失败，刻意不兜底
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 server/.env 里设置 PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
      # 首次起库（数据卷为空）时自动执行：建表幂等，重复启动不会再跑
      # 注意：不挂 db/seed.sql —— 种子只给 Day 16 的临时库用，正式库只跑真实数据
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  asr:
    # fun-asr 转写微服务（F13）：视频/音频 URL → 结构化转写包，供 server 任务链路调用
    build:
      context: .            # 仓库根，Dockerfile 里 COPY asr/ 才能打进包
      dockerfile: asr/Dockerfile
      args:
        # 可选 apt 换源：国内 ECS 直连 archive.ubuntu.com 会卡死，传镜像站秒下。
        # 用法：APT_MIRROR=http://mirrors.aliyun.com docker compose build asr
        # 也可写进根 .env 的 APT_MIRROR=...（compose 会自动展开）
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file:
      - ./asr/.env    # DASHSCOPE_API_KEY / SERVICE_TOKEN 等（.env.example 有样例）
    environment:
      JOBS_DIR: /app/jobs
    volumes:
      # 命名卷：临时媒体与 job JSON，不向宿主机 data/ 塞临时产物
      - asr-jobs:/app/jobs
      # 平台 cookies（B 站 / YouTube 登录态）：宿主放 ./asr/.secrets/*.txt，容器内只读。
      # 文件名即平台名（bilibili.txt / youtube.txt），代码按来源域名自动选用；.gitignore 已排除。
      - ./asr/.secrets:/app/secrets:ro
    networks: [internal]
    # 刻意不写 ports：只在 compose 内网被 server 调用，不对外发布

  server:
    build: ./server
    restart: unless-stopped
    # 秘密与模型配置放 server/.env（不入库）；下面 environment 覆盖容器内部地址
    env_file:
      - ./server/.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /app/data
      # 容器内用服务名访问 Chroma，覆盖 .env 里可能配置的公网地址
      CHROMA_URL: http://chroma:8000
      # 转写服务走内网服务名；token 从 server/.env 的 ASR_SERVICE_TOKEN 读
      ASR_SERVICE_URL: http://asr:8000
      # Postgres 走内网服务名 pg；口令同样从 server/.env 的 PG_PASSWORD 展开（compose 会插值 env_file）
      DATABASE_URL: postgres://buddy:${PG_PASSWORD:?请在 server/.env 里设置 PG_PASSWORD}@pg:5432/buddy
    volumes:
      # 资料目录绑定挂载：宿主机上也能直接备份/Obsidian 打开
      - ./data:/app/data
    networks: [internal]
    # depends_on 全用长语法：pg 要等 healthy 才起 server（避免 server 先启动导致首批请求全 503）；
    # chroma / asr 保持 started 即可，它们慢一点只影响对应接口、不影响进程起来
    depends_on:
      chroma:
        condition: service_started
      asr:
        condition: service_started
      pg:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      # 现在只开 80；等安全组放行 443、域名就位后再加证书这段
      - "80:80"
    networks: [internal]
    depends_on:
      - server

networks:
  internal:
    ipam:
      config:
        # 固定一个不与宿主机其他服务冲突的网段（2026-09-26 踩过，务必保留）。
        # 原因：本机 sing-box（v2rayN 的 TUN 模式）会把接口地址设成 172.18.0.1/30，
        # 这条 /30 路由比 Docker 的 /16 更具体，命中优先级更高，于是 172.18.0.3（web 容器）
        # 被当成「本地广播地址」，宿主机访问 80 端口直接被重置 —— 容器本身一直是健康的。
        # 换到 172.30.0.0/16 后，容器 IP 不再落进 sing-box 的 /30 范围内。
        - subnet: 172.30.0.0/16

volumes:
  chroma-data:
  asr-jobs:
  pg-data:
